<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eef4ff" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Daily To-Do List</title>
<style>
:root{
  --ink:#15213a;--muted:#71809d;--line:rgba(90,112,160,.17);
  --blue:#6fa7ff;--purple:#9d7cff;--glass:rgba(255,255,255,.54);
  --glass-strong:rgba(255,255,255,.72);--shadow:0 24px 70px rgba(72,92,145,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100vh;padding:24px;
  background:
   radial-gradient(circle at 16% 8%,rgba(111,167,255,.28),transparent 30%),
   radial-gradient(circle at 85% 14%,rgba(157,124,255,.26),transparent 32%),
   radial-gradient(circle at 50% 95%,rgba(122,196,255,.20),transparent 34%),
   linear-gradient(145deg,#f8fbff 0%,#edf3ff 46%,#f5efff 100%);
  background-attachment:fixed;
}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(14px);pointer-events:none;z-index:-1}
body:before{width:260px;height:260px;left:-80px;bottom:7vh;background:rgba(113,169,255,.22)}
body:after{width:300px;height:300px;right:-110px;top:32vh;background:rgba(178,137,255,.18)}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1120px;margin:0 auto}
.glass{
  position:relative;overflow:hidden;background:var(--glass);
  border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);
}
.glass:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.60),rgba(255,255,255,.06) 38%,transparent 58%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em;font-size:22px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 24px rgba(116,118,235,.25);position:relative}
.logo:after{content:"";position:absolute;width:12px;height:12px;border:2px solid white;border-radius:50%;left:10px;top:10px;opacity:.95}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill,.iconbtn{border:1px solid rgba(97,115,160,.14);background:rgba(255,255,255,.55);color:var(--ink);box-shadow:0 7px 24px rgba(85,101,145,.08);backdrop-filter:blur(16px);transition:.2s ease}
.pill:hover,.iconbtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.78)}
.pill{border-radius:999px;padding:10px 14px;font-size:13px}
.shortcut{color:var(--muted)}
.shortcut b{color:var(--ink);font-weight:700}
.hero{border-radius:30px;padding:30px;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;margin-bottom:18px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#7a87a2;font-weight:750}
.date-title{font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.055em;margin:10px 0 8px;font-weight:820}
.subline{font-size:15px;color:var(--muted)}
.stats{display:flex;align-items:flex-end;justify-content:flex-end;gap:28px;position:relative;z-index:1}
.stat{text-align:right}.stat strong{display:block;font-size:34px;letter-spacing:-.05em}.stat span{font-size:12px;color:var(--muted)}
.progress-card,.week-card,.tasks-card{border-radius:26px;padding:22px;margin-bottom:18px}
.section-head{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.section-head h2{font-size:15px;margin:0;font-weight:760}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.progress-meta{text-align:right}.progress-meta strong{font-size:16px}.progress-meta div{font-size:12px;color:var(--muted);margin-top:4px}
.slider-shell{position:relative;height:42px;display:flex;align-items:center;touch-action:none;user-select:none;z-index:2;outline:none}
.track{position:absolute;left:0;right:0;height:8px;border-radius:999px;background:rgba(96,113,160,.10);box-shadow:inset 0 1px 3px rgba(61,75,110,.08)}
.fill{position:absolute;left:0;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 0 20px rgba(124,132,255,.33);width:0%}
.thumb{position:absolute;width:26px;height:26px;border-radius:50%;left:0;transform:translateX(-50%);background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 20px rgba(78,95,145,.23),inset 0 0 0 6px rgba(132,128,255,.12)}
.thumb:after{content:"";position:absolute;inset:7px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple))}
.slider-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:-2px;position:relative;z-index:1}
.week-nav{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:14px}.week-nav button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:5px}.week-nav button:hover{color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;position:relative;z-index:1}
.day{border:1px solid transparent;background:rgba(255,255,255,.42);border-radius:18px;padding:13px 7px;text-align:center;transition:.22s ease;min-width:0}
.day:hover{transform:translateY(-2px);background:rgba(255,255,255,.7)}
.day .dow{font-size:11px;color:var(--muted);margin-bottom:7px}.day .num{font-weight:780;font-size:19px}.day .month{font-size:10px;color:#9aa6bc;margin-top:3px}
.day.selected{background:linear-gradient(145deg,rgba(111,167,255,.20),rgba(157,124,255,.20));border-color:rgba(132,136,246,.28);box-shadow:0 10px 28px rgba(91,105,178,.13)}
.day.today .num{color:#716df0}
.task-entry{display:flex;gap:10px;position:relative;z-index:1}.task-entry input{flex:1;min-width:0;border:1px solid rgba(95,112,157,.13);outline:none;border-radius:17px;padding:14px 16px;background:rgba(255,255,255,.58);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.task-entry input:focus{border-color:rgba(124,130,246,.35);box-shadow:0 0 0 4px rgba(125,132,247,.08)}
.addbtn{border:0;border-radius:17px;padding:0 18px;font-weight:750;color:white;background:linear-gradient(135deg,#72a8ff,#9b7cff);box-shadow:0 12px 24px rgba(115,119,236,.22)}
.task-summary{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;position:relative;z-index:1;font-size:12px;color:var(--muted)}
.task-list{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.task{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.43);border:1px solid rgba(255,255,255,.62);border-radius:16px;padding:12px 12px;transition:.18s ease}.task:hover{background:rgba(255,255,255,.67)}
.check{width:21px;height:21px;flex:0 0 21px;border-radius:8px;border:1px solid rgba(104,120,163,.24);background:rgba(255,255,255,.65);display:grid;place-items:center;color:white}.task.done .check{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:transparent}.check span{font-size:12px;opacity:0}.task.done .check span{opacity:1}
.task-text{flex:1;font-size:14px}.task.done .task-text{text-decoration:line-through;color:#9aa4b8}.delete{border:0;background:transparent;color:#a4aec0;border-radius:9px;padding:4px 7px}.delete:hover{background:rgba(255,255,255,.7);color:#6e7890}
.empty{text-align:center;padding:32px 10px;color:var(--muted);font-size:13px}
.notice{display:none;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.54);color:var(--muted);font-size:11px;position:relative;z-index:2}.notice.show{display:block}
.footer{text-align:center;color:#8a97ae;font-size:11px;padding:7px 0 18px}
@media(max-width:760px){body{padding:14px}.hero{grid-template-columns:1fr;padding:22px}.stats{justify-content:flex-start}.stat{text-align:left}.week{gap:5px}.day{padding:11px 3px;border-radius:14px}.day .num{font-size:16px}.day .month{display:none}.shortcut{display:none}.progress-card,.week-card,.tasks-card{padding:18px}.task-entry{flex-direction:column}.addbtn{height:46px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo"></span><span>Daily</span></div>
    <div class="actions">
      <span class="pill shortcut">Notifications&nbsp;&nbsp;<b>Alt+T</b></span>
      <button class="pill" id="todayBtn">回到今天</button>
      <button class="pill" id="notifyBtn">手机推送</button>
    </div>
  </header>

  <section class="hero glass">
    <div style="position:relative;z-index:1">
      <div class="eyebrow" id="weekdayLabel">Daily focus</div>
      <div class="date-title" id="dateTitle">今天要做什么？</div>
      <div class="subline" id="dateSub"></div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="openCount">0</strong><span>待完成</span></div>
      <div class="stat"><strong id="doneCount">0</strong><span>已完成</span></div>
    </div>
  </section>

  <section class="progress-card glass">
    <div class="section-head">
      <div><h2 id="yearTitle">年度时间进度</h2><p>拖动滑块，下面日期会跟着移动</p></div>
      <div class="progress-meta"><strong id="dayProgress">第 1 / 365 天</strong><div id="percentProgress">0%</div></div>
    </div>
    <div class="slider-shell" id="slider" tabindex="0" aria-label="年度时间进度滑块">
      <div class="track"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
    </div>
    <div class="slider-labels"><span>1月</span><span>4月</span><span>7月</span><span>10月</span><span>12月</span></div>
  </section>

  <section class="week-card glass">
    <div class="week-nav"><button id="prevWeek">← 上一周</button><span id="weekRange" style="font-size:12px;color:var(--muted)"></span><button id="nextWeek">下一周 →</button></div>
    <div class="week" id="week"></div>
  </section>

  <section class="tasks-card glass">
    <div class="task-entry"><input id="taskInput" maxlength="120" placeholder="添加一个新任务…" autocomplete="off"><button class="addbtn" id="addBtn">添加任务</button></div>
    <div class="notice" id="notice"></div>
    <div class="task-summary"><span>任务</span><span id="summary">0 件待完成</span></div>
    <div class="task-list" id="taskList"></div>
  </section>
  <div class="footer">任务会自动保存在这个浏览器中</div>
</div>
<script>
const $=s=>document.querySelector(s);
const STORE='dailyTodoListV9';
let db=JSON.parse(localStorage.getItem(STORE)||'{}');
let selected=startOfDay(new Date());
let sliderCurrent=0,sliderTarget=0,raf=0,dragging=false;
const cnWeek=['日','一','二','三','四','五','六'];
const cnWeekLong=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function daysInYear(y){return new Date(y,1,29).getMonth()===1?366:365}
function dayOfYear(d){return Math.floor((startOfDay(d)-new Date(d.getFullYear(),0,1))/86400000)+1}
function fromDay(y,n){return new Date(y,0,n)}
function sameDay(a,b){return key(a)===key(b)}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function tasksFor(d){return db[key(d)]||[]}
function formatDate(d){return `${d.getMonth()+1}月${d.getDate()}日${cnWeekLong[d.getDay()]}`}
function setSelected(d,fromSlider=false){selected=startOfDay(d);if(!fromSlider){const total=daysInYear(selected.getFullYear());sliderCurrent=sliderTarget=(dayOfYear(selected)-1)/(total-1)}render()}

function render(){
  const today=startOfDay(new Date()), tasks=tasksFor(selected), open=tasks.filter(t=>!t.done).length, done=tasks.length-open;
  $('#weekdayLabel').textContent=sameDay(selected,today)?'TODAY':'DAILY';
  $('#dateTitle').textContent=sameDay(selected,today)?'今天要做什么？':formatDate(selected);
  $('#dateSub').textContent=sameDay(selected,today)?formatDate(selected):`${selected.getFullYear()}年 · 计划这一天`;
  $('#openCount').textContent=open;$('#doneCount').textContent=done;
  const y=selected.getFullYear(),total=daysInYear(y),n=dayOfYear(selected),pct=Math.round((n-1)/(total-1)*100);
  $('#yearTitle').textContent=`${y} 年度时间进度`;$('#dayProgress').textContent=`第 ${n} / ${total} 天`;$('#percentProgress').textContent=`${pct} %`;
  const p=(n-1)/(total-1)*100;$('#fill').style.width=p+'%';$('#thumb').style.left=p+'%';
  renderWeek();renderTasks();
}
function renderWeek(){
  const wrap=$('#week');wrap.innerHTML='';const monday=new Date(selected);monday.setDate(selected.getDate()-((selected.getDay()+6)%7));
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  $('#weekRange').textContent=`${monday.getMonth()+1}.${monday.getDate()} – ${sunday.getMonth()+1}.${sunday.getDate()}`;
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);const b=document.createElement('button');b.className='day'+(sameDay(d,selected)?' selected':'')+(sameDay(d,new Date())?' today':'');
    b.innerHTML=`<div class="dow">${cnWeek[d.getDay()]}</div><div class="num">${d.getDate()}</div><div class="month">${d.getMonth()+1}月</div>`;b.onclick=()=>setSelected(d);wrap.appendChild(b)
  }
}
function renderTasks(){
  const list=$('#taskList'),tasks=tasksFor(selected),open=tasks.filter(t=>!t.done).length;$('#summary').textContent=`${open} 件待完成`;list.innerHTML='';
  if(!tasks.length){list.innerHTML='<div class="empty">这一天还没有任务</div>';return}
  tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');row.innerHTML=`<button class="check" aria-label="完成任务"><span>✓</span></button><div class="task-text"></div><button class="delete" aria-label="删除任务">×</button>`;row.querySelector('.task-text').textContent=t.text;row.querySelector('.check').onclick=()=>{t.done=!t.done;save();render()};row.querySelector('.delete').onclick=()=>{tasks.splice(i,1);db[key(selected)]=tasks;save();render()};list.appendChild(row)})
}
function addTask(){
  const inp=$('#taskInput'),text=inp.value.trim();if(!text)return;const k=key(selected);(db[k]??=[]).push({text,done:false,created:Date.now()});save();inp.value='';render();
  if('Notification'in window&&Notification.permission==='granted'){try{new Notification('已添加任务',{body:text})}catch(e){}}
}
$('#addBtn').onclick=addTask;$('#taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
$('#todayBtn').onclick=()=>setSelected(new Date());
$('#prevWeek').onclick=()=>{const d=new Date(selected);d.setDate(d.getDate()-7);setSelected(d)};
$('#nextWeek').onclick=()=>{const d=new Date(selected);d.setDate(d.getDate()+7);setSelected(d)};
window.addEventListener('keydown',e=>{if(e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();$('#taskInput').focus()}});

const slider=$('#slider');
function pointerTarget(e){const r=slider.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
function animateSlider(){
  sliderCurrent+=(sliderTarget-sliderCurrent)*.18;
  if(Math.abs(sliderTarget-sliderCurrent)<.0005)sliderCurrent=sliderTarget;
  const y=selected.getFullYear(),total=daysInYear(y),n=1+Math.round(sliderCurrent*(total-1));selected=startOfDay(fromDay(y,n));render();
  if(sliderCurrent!==sliderTarget||dragging)raf=requestAnimationFrame(animateSlider);else raf=0
}
function beginAnim(){if(!raf)raf=requestAnimationFrame(animateSlider)}
slider.addEventListener('pointerdown',e=>{dragging=true;slider.setPointerCapture(e.pointerId);sliderTarget=pointerTarget(e);beginAnim()});
slider.addEventListener('pointermove',e=>{if(dragging){sliderTarget=pointerTarget(e);beginAnim()}});
slider.addEventListener('pointerup',()=>{dragging=false;beginAnim()});slider.addEventListener('pointercancel',()=>{dragging=false});
slider.addEventListener('keydown',e=>{let delta=0;if(e.key==='ArrowLeft')delta=-1;if(e.key==='ArrowRight')delta=1;if(e.key==='PageUp')delta=7;if(e.key==='PageDown')delta=-7;if(!delta)return;e.preventDefault();const y=selected.getFullYear(),total=daysInYear(y);sliderTarget=Math.max(0,Math.min(1,sliderTarget+delta/(total-1)));beginAnim()});

const notice=$('#notice');function showNotice(text){notice.textContent=text;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),5500)}
$('#notifyBtn').onclick=async()=>{
  if(!('Notification'in window)){showNotice('当前浏览器不支持通知。');return}
  try{const p=await Notification.requestPermission();if(p==='granted'){showNotice('浏览器通知已开启。GitHub Pages 静态版只支持当前设备通知；电脑到手机的跨设备推送需要额外后端服务。')}else showNotice('通知权限未开启。')}catch(e){showNotice('无法开启通知。')}
};
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const total=daysInYear(selected.getFullYear());sliderCurrent=sliderTarget=(dayOfYear(selected)-1)/(total-1);render();
</script>
</body>
</html>
